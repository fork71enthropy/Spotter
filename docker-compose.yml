version: "3.9"

services:
  web:
    build: .
    #command: python3 /code/manage.py runserver 0.0.0.0:8000
    command: gunicorn django_project.wsgi -b 0.0.0.0:8000 #gunicorn server for production

    volumes:
      - .:/code
    ports:
      - 8000:8000
    depends_on:
      - db
    env_file:
      - .env
  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      - "POSTGRES_HOST_AUTH_METHOD=trust"
  poller:
    build: .
    command: python3 manage.py poll_affluences
    volumes:
      - .:/code
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    
volumes:
  postgres_data: 















